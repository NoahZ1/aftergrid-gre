<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050607"><meta name="description" content="A cinematic voxel mystery. One traveler. A hidden planetary secret. Your choices decide what happens next."><title>Aftergrid · A Planetary Mystery</title><link rel="stylesheet" href="style.css"></head><body>
<main id="film"><canvas id="board" aria-label="Cinematic voxel world. Drag to look around and scroll to zoom."></canvas><div class="atmosphere" aria-hidden="true"></div><div id="cinemaShade" aria-hidden="true"></div>
<nav class="world-controls" aria-label="Film controls"><button class="bubble quiet" id="focus" data-tip="Focus" aria-label="Focus on the current scene"></button><button class="bubble quiet" id="journalButton" data-tip="Memories" aria-label="Open collected evidence"></button><button class="bubble quiet" id="fullscreen" data-tip="Fullscreen" aria-label="Enter full screen"></button><button class="bubble quiet" id="menuButton" data-tip="Restart" aria-label="Open expedition menu"></button></nav>
<div id="pace" hidden aria-label="Response timer"></div><div id="vitals" role="img" hidden></div><div id="progress" aria-label="Evidence collected"></div><button class="bubble quiet" id="skip" data-tip="Skip" aria-label="Skip cinematic" hidden></button>
<section id="story" aria-live="polite"><div id="storyCopy"><div id="chapter"></div><h1 id="sceneTitle"></h1><p id="narration"></p></div><p id="puzzlePrompt" hidden></p><p id="consequence"></p><div id="choices" aria-label="Choose what happens next"></div></section>
<section id="menu" class="overlay" hidden aria-label="Expedition menu"><div class="menu-inner"><div class="eyebrow">AFTERGRID</div><h2>Unlock a world.<br>Train your mind.</h2><p>GRE verbal and quantitative practice.<br>Choose answers. Discover the planet.</p><p>Original GRE-style practice · no written responses.</p><p id="campaignHint" aria-live="polite"></p><div class="factions" role="group" aria-label="Choose your civilization"><button class="bubble faction" data-faction="0" data-tip="Wayfarers" aria-label="Wayfarers, orange explorers"></button><button class="bubble faction" data-faction="1" data-tip="Foundry" aria-label="Foundry, blue machines"></button><button class="bubble faction" data-faction="2" data-tip="Verdant" aria-label="Verdant, living green technology"></button></div><div class="menu-actions"><button class="bubble quiet" id="resume" data-tip="Resume" aria-label="Resume this story"></button><button class="bubble launch" id="start" data-tip="Begin" aria-label="Begin a new randomized story"></button></div><div id="confirm" hidden><p>Leave this story and begin another?</p><button class="bubble" id="cancel" data-tip="Stay" aria-label="Keep this story"></button><button class="bubble" id="replace" data-tip="Begin" aria-label="Replace this story with a new expedition"></button></div></div></section>
<section id="journal" class="overlay" hidden aria-label="Recovered memories"><button class="bubble quiet overlay-close" id="closeJournal" data-tip="Close" aria-label="Close recovered memories"></button><div class="journal-inner"><div class="eyebrow">RECOVERED MEMORIES</div><h2 id="journalTitle"></h2><div id="clues"></div><div id="path"></div></div></section>
<div id="tooltip" role="tooltip" hidden></div><div id="announcement" class="sr-only" role="status" aria-live="polite"></div></main>
<script src="engine.js"></script><script src="gre-questions.js"></script><script src="adventure-engine.js"></script><script src="adventure-renderer.js"></script><script src="adventure.js"></script></body></html>
